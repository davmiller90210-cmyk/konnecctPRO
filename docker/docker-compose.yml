name: crm

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      SHELL: /bin/bash
      SITE_NAME: ${SITE_NAME:-crm.localhost}
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      # Optional: live-mount Konnecct app from host repo (../crm = konnecctPRO/crm). Uncomment after first bench exists.
      # - ../crm:/home/frappe/frappe-bench/apps/crm
    depends_on:
      - mariadb
      - redis

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frappe

volumes:
  mariadb-data:
  caddy_data:
  caddy_config:
